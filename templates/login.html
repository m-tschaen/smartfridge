<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Smart Fridge - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6" style="background: #c99a9c;">

    <div class="p-8 rounded-3xl shadow-xl w-full max-w-md" style="background: #f7ece7;">
        <h1 class="text-2xl font-bold mb-6 text-center" style="color: #4a2c2e;">Smart Fridge</h1>

        <div class="flex mb-6 rounded-full overflow-hidden" style="border: 2px solid #e0c4c5;">
            <button id="tab-login" onclick="showTab('login')"
                    class="flex-1 p-2 font-medium transition" style="background: #b97577; color: white;">
                Se connecter
            </button>
            <button id="tab-signup" onclick="showTab('signup')"
                    class="flex-1 p-2 transition" style="background: #f7ece7; color: #a17879;">
                S'inscrire
            </button>
        </div>

        <div id="form-login">
            <input id="login-username" placeholder="Nom d'utilisateur"
                   class="w-full p-3 mb-3 rounded-xl focus:outline-none transition" style="border: 2px solid #e0c4c5;">
            <input id="login-password" type="password" placeholder="Mot de passe"
                   class="w-full p-3 mb-4 rounded-xl focus:outline-none transition" style="border: 2px solid #e0c4c5;">
            <button onclick="login()"
                    class="w-full p-3 rounded-full text-white font-medium shadow-sm hover:shadow-md transition" style="background: #b97577;">
                Se connecter
            </button>
        </div>

        <div id="form-signup" class="hidden">
            <input id="signup-username" placeholder="Nom d'utilisateur"
                   class="w-full p-3 mb-3 rounded-xl focus:outline-none transition" style="border: 2px solid #e0c4c5;">
            <input id="signup-password" type="password" placeholder="Mot de passe"
                   class="w-full p-3 mb-4 rounded-xl focus:outline-none transition" style="border: 2px solid #e0c4c5;">

            <div class="grid grid-cols-2 gap-3 mb-3">
                <input id="signup-weight" type="number" placeholder="Poids (kg)"
                       class="p-3 rounded-xl focus:outline-none transition" style="border: 2px solid #e0c4c5;">
                <input id="signup-height" type="number" placeholder="Taille (cm)"
                       class="p-3 rounded-xl focus:outline-none transition" style="border: 2px solid #e0c4c5;">
            </div>
            <input id="signup-age" type="number" placeholder="Age"
                   class="w-full p-3 mb-3 rounded-xl focus:outline-none transition" style="border: 2px solid #e0c4c5;">

            <select id="signup-gender" class="w-full p-3 mb-3 rounded-xl" style="border: 2px solid #e0c4c5;">
                <option value="male">Homme</option>
                <option value="female">Femme</option>
            </select>

            <select id="signup-activity" class="w-full p-3 mb-3 rounded-xl" style="border: 2px solid #e0c4c5;">
                <option value="sedentary">Sedentaire</option>
                <option value="light">Legere</option>
                <option value="moderate">Moderee</option>
                <option value="active">Active</option>
                <option value="very_active">Tres active</option>
            </select>

            <select id="signup-goal" class="w-full p-3 mb-4 rounded-xl" style="border: 2px solid #e0c4c5;">
                <option value="loss">Perte de poids</option>
                <option value="maintain">Maintien</option>
                <option value="gain">Prise de poids</option>
            </select>

            <button onclick="signup()"
                    class="w-full p-3 rounded-full text-white font-medium shadow-sm hover:shadow-md transition" style="background: #b97577;">
                Créer mon compte
            </button>
        </div>

        <p id="message" class="text-sm mt-3 text-center" style="color: #8b5a5c;"></p>
    </div>

    <script>
        function showTab(tab) {
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('form-signup').classList.toggle('hidden', tab !== 'signup');

            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');

            if (tab === 'login') {
                loginTab.style.background = '#b97577';
                loginTab.style.color = 'white';
                signupTab.style.background = '#f7ece7';
                signupTab.style.color = '#a17879';
            } else {
                signupTab.style.background = '#b97577';
                signupTab.style.color = 'white';
                loginTab.style.background = '#f7ece7';
                loginTab.style.color = '#a17879';
            }
        }

        function showMessage(text) {
            document.getElementById('message').textContent = text;
        }

        async function login() {
            const body = new URLSearchParams({
                username: document.getElementById('login-username').value,
                password: document.getElementById('login-password').value,
            });
            const res = await fetch('/token', {
                method: 'POST',
                body: body,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            });
            const data = await res.json();
            if (!res.ok) {
                showMessage(data.detail || 'Identifiants incorrects');
                return;
            }
            localStorage.setItem('token', data.access_token);
            window.location.href = '/homepage';
        }

        async function signup() {
            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;

            const signupBody = new URLSearchParams({ username, password });
            const signupRes = await fetch('/signup', {
                method: 'POST',
                body: signupBody,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            });
            const signupData = await signupRes.json();
            if (!signupRes.ok) {
                showMessage(signupData.detail || 'Erreur lors de l\'inscription');
                return;
            }

            const tokenRes = await fetch('/token', {
                method: 'POST',
                body: signupBody,
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            });
            const tokenData = await tokenRes.json();
            if (!tokenRes.ok) {
                showMessage('Compte cree mais connexion echouee');
                return;
            }
            const token = tokenData.access_token;
            localStorage.setItem('token', token);

            const profileData = {
                weight_kg: parseFloat(document.getElementById('signup-weight').value),
                height_cm: parseFloat(document.getElementById('signup-height').value),
                age: parseInt(document.getElementById('signup-age').value),
                gender: document.getElementById('signup-gender').value,
                activity_level: document.getElementById('signup-activity').value,
                goal: document.getElementById('signup-goal').value,
            };

            const profileRes = await fetch('/profile', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token,
                },
                body: JSON.stringify(profileData),
            });

            if (!profileRes.ok) {
                showMessage('Compte cree mais profil non enregistre');
                return;
            }

            window.location.href = '/homepage';
        }
    </script>
</body>
</html>
